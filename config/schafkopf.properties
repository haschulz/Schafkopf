# Reloaded whenever the application starts.
noGame.policy=STOCK

# Each player may double after receiving this many cards.
klopfen.enabled=true
klopfen.afterCards=4
kontra.enabled=true
re.enabled=true

# Tarif notation: Grundtarif / Rufspiel / Solo, in cents.
# 10/20/50. Use 5/5/20 for a 5/20 round or 10/10/50 for 10/50.
tariff.baseCents=10
tariff.rufspielCents=20
tariff.soloCents=50
# Half Laufende are rounded down to whole cents.
tariff.halfLaufende=false

# A Stock doubles the following round's tariff.
stock.multiplier=2

# Muss-Spiel: holder of Eichel-Ober must announce this configured solo.
muss.gameType=FARBSOLO
muss.trumpSuit=EICHEL